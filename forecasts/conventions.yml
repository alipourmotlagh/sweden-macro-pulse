  spread_10y_policy:
    frequency: monthly
    label: {en: "10-year yield minus policy rate (own calculation)", sv: "10-årsränta minus styrränta (egen beräkning)"}
    note:
      en: "10-year government bond yield minus the policy rate, in percentage points. Our own calculation from the monthly averages of those two series in rates_monthly.json; it is not a series published by the Riksbank. A negative value means the policy rate is above the 10-year yield."
      sv: "Statsobligationsränta på 10 år minus styrräntan, i procentenheter. Vår egen beräkning av månadsmedelvärdena för de två serierna i rates_monthly.json; det är inte en serie som Riksbanken publicerar. Ett negativt värde betyder att styrräntan är högre än 10-årsräntan."
