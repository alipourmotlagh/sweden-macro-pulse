[project]
name = "sweden-macro-pulse"
version = "0.1.0"
description = "Open, tested pipeline for Swedish macro and finance data (Riksbank, SCB, KI)."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "openpyxl>=3.1",
  "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["ingest", "export", "forecasts"]
