version: 2

models:
  - name: mart_rates_monthly
    description: Monthly average rates. spread_10y_policy is own calculation.
    columns:
      - name: month
        tests: [not_null, unique]
      - name: policy_rate
        tests: [not_null]
  - name: mart_catalogue
    description: Coverage and freshness per series.
    columns:
      - name: series_key
        tests: [not_null, unique]
  - name: mart_ki_rates_vintages
    description: KI interest-rate forecasts by release (vintage).
    columns:
      - name: vintage
        tests: [not_null]
      - name: period
        tests: [not_null]
    tests:
      - unique:
          column_name: "vintage || '|' || variable || '|' || cast(period as varchar)"
  - name: mart_cpif_monthly
    description: CPIF annual change in percent (SCB TAB6590), as published.
    columns:
      - name: month
        tests: [not_null]
      - name: value
        tests: [not_null]
    tests:
      - unique:
          column_name: "series_key || '|' || cast(month as varchar)"
  - name: mart_mortgage_monthly
    description: Households' housing-loan interest rates by agreement type and fixation period (SCB TAB5783, source the Riksbank).
    columns:
      - name: series_key
        tests: [not_null]
      - name: month
        tests: [not_null]
      - name: value
        tests: [not_null]
    tests:
      - unique:
          column_name: "series_key || '|' || cast(month as varchar)"
