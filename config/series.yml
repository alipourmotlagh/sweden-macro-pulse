# Source registry. One entry per series/table we ingest.
# status: "verify" = endpoint/format written from documentation, NOT yet confirmed by a live run.
# Flip to "ok" after the first successful GitHub Actions run (week-1 exit criterion).

riksbank:
  base_url: https://api.riksbank.se/swea/v1
  # Optional key via env RIKSBANK_API_KEY (header Ocp-Apim-Subscription-Key). Works without, with tighter limits.
  start: "2000-01-01"
  min_seconds_between_calls: 13   # conservative for anonymous use; lower when a key is set
  status: verify
  series:
    - id: SECBREPOEFF
      key: policy_rate
      unit: "%"
    # STIBOR (SEDP3MSTIBORDELAYC) is closed at the Riksbank since 2020-07-03; SFBF's licence restricts reuse.
    # The 3-month Treasury bill is a live, openly reusable short-term market rate.
    - id: SETB3MBENCH
      key: tbill_3m
      unit: "%"
    - id: SEGVB10YC
      key: gov_bond_10y
      unit: "%"

riksbank_mpd:
  # Monetary Policy Data API v1: the Riksbank's own forecasts per policy round (e.g. '2024:1'). Raw landing only until
  # the series ids are known (first run lands forecasts/series_ids and forecasts/policy_rounds). Same key as SWEA.
  base_url: https://api.riksbank.se/monetary_policy_data/v1
  status: verify

scb:
  # PxWebApi 2. API data is CC0 (SCB recommends "Source: Statistics Sweden"); data from other agencies credit that agency.
  # Limits: 10 calls per 10 s per IP, 100,000 values per table. Checked 2026-10-22.
  base_url: https://statistikdatabasen.scb.se/api/v2
  status: verify
  tables:
    # CPIF (CPI with fixed interest rate), 2020=100. 000007ZM = annual change in percent. Monthly, from 1987.
    - table_id: TAB6590
      key: cpif
      selection:
        ContentsCode: ["000007ZM"]
        Tid: ["*"]
    # Lending rates to households for housing loans (source agency: the Riksbank), monthly, from 2005M09.
    # Avtal: 0100 = new and renegotiated agreements, 0200 = outstanding. Rantebindningstid: 1.1 all fixation periods,
    # 1.1.1 up to 3 months (floating), 1.1.2.1 3 months-1 year, 1.1.2.2 1-5 years, 1.1.2.3 over 5 years.
    - table_id: TAB5783
      key: mortgage_rates
      selection:
        Referenssektor: ["1"]
        Motpartssektor: ["2c"]
        Avtal: ["0100", "0200"]
        Rantebindningstid: ["1.1", "1.1.1", "1.1.2.1", "1.1.2.2", "1.1.2.3"]
        ContentsCode: ["000004ZW"]
        Tid: ["*"]

ki:
  # KI PxWeb v1 API. Directory listings and metadata verified 2026-10-15; data POST verified on first Actions run.
  # Terms: free reuse incl. commercial, manual or via API (konj.se "Så fungerar databaserna"). We credit KI anyway.
  status: verify
  stats_base: https://statistik.konj.se/PxWeb/api/v1/sv/KonjBar
  forecast_base: https://prognos.konj.se/PxWeb/api/v1/sv
  stats_tables:
    - key: ki_barometer
      path: indikatorer/Indikatorm.px      # barometer indicator and other indicators, monthly
  forecast_tables:
    # Fetches SenastePrognosen (latest) plus every release under TidigarePrognoser (quarterly vintages since 2015).
    - key: ki_rates_monthly
      path: f06_rantorochvaxelkurser/F0604.px   # includes 10y yield, 5y yield, 6m bill, ... (variable codes F0604*)
